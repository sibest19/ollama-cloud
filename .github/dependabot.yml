# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # Home Assistant and pytest-homeassistant-custom-component must be bumped
      # together by hand: each phacc release pins an exact homeassistant version
      # (including betas), so independent bumps leave requirements unresolvable.
      - dependency-name: "homeassistant"
      - dependency-name: "pytest-homeassistant-custom-component"
